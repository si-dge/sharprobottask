services:
  app:
    build: ./backend
    image: sharprobottask-app:latest
    environment:
      DB_DSN: ${DB_DSN:-pgsql:host=db;port=5432;dbname=products}
      DB_USER: ${DB_USER:-products}
      DB_PASSWORD: ${DB_PASSWORD:-products}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-imports}
      IMPORT_MAX_SIZE: ${IMPORT_MAX_SIZE:-52428800}
    volumes:
      - imports_data:/tmp/imports
      - ./import_example.xlsx:/import_example.xlsx:ro
    depends_on:
      db: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    ports: ["8080:8080"]
  worker:
    image: sharprobottask-app:latest
    command: ["php", "worker.php"]
    environment:
      DB_DSN: ${DB_DSN:-pgsql:host=db;port=5432;dbname=products}
      DB_USER: ${DB_USER:-products}
      DB_PASSWORD: ${DB_PASSWORD:-products}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-imports}
      IMPORT_MAX_SIZE: ${IMPORT_MAX_SIZE:-52428800}
    volumes:
      - imports_data:/tmp/imports
    depends_on:
      db: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-products}
      POSTGRES_USER: ${DB_USER:-products}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-products}
    volumes:
      [
        "db_data:/var/lib/postgresql/data",
        "./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro",
      ]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U products -d products"],
        interval: 5s,
        timeout: 5s,
        retries: 10,
      }
  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
  kafka-init:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-imports}
    depends_on:
      kafka: { condition: service_healthy }
    command:
      [
        "sh",
        "-c",
        "/opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic \"$${KAFKA_TOPIC}\" --partitions 1 --replication-factor 1",
      ]
  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [app]
    ports: ["80:80"]
volumes:
  db_data:
  imports_data:

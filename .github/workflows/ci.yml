name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  container-build:
    name: Build Docker containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build Docker images
        run: docker compose build --pull

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, zip, intl
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PHPStan
        run: composer analyse

  php-cs-fixer:
    name: PHP CS Fixer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, zip, intl
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check PHP coding style
        run: composer cs-check

  fixtures:
    name: Load and verify Doctrine fixtures
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: products
          POSTGRES_USER: products
          POSTGRES_PASSWORD: products
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U products -d products"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DB_DSN: pgsql:host=127.0.0.1;port=5432;dbname=products
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: products
      DB_USER: products
      DB_PASSWORD: products
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: products
      PGUSER: products
      PGPASSWORD: products
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, zip, intl
          coverage: none
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
        working-directory: .
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Create database schema
        run: psql -v ON_ERROR_STOP=1 -f database/schema.sql
      - name: Load fixtures
        run: composer db:seed
      - name: Verify products, attributes, and images fixtures
        run: |
          test "$(psql -tAc 'SELECT COUNT(*) FROM products' | tr -d '[:space:]')" -eq 2
          test "$(psql -tAc 'SELECT COUNT(*) FROM product_attributes' | tr -d '[:space:]')" -eq 3
          test "$(psql -tAc 'SELECT COUNT(*) FROM product_images' | tr -d '[:space:]')" -eq 2

  crud-tests:
    name: Run backend PHPUnit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, zip, intl
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run non-API PHPUnit test suite
        run: composer test -- --exclude-group api

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  playwright:
    name: Playwright e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: container-build
    steps:
      - uses: actions/checkout@v4
      - name: Start application stack
        run: docker compose up -d --build --remove-orphans
      - name: Wait for API health check
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=100 app worker nginx
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install Playwright dependencies
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: tests
        env:
          BASE_URL: http://localhost
        run: npm test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          if-no-files-found: ignore
      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
